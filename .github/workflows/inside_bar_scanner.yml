name: 15-Min Inside-Bar Scanner

on:
  schedule:
    # Start one long-lived watcher at 10:20 IST (04:50 UTC), Mon-Fri.
    - cron: "50 4 * * 1-5"
    # Fallback starts if the first scheduled event is dropped.
    - cron: "35 5 * * 1-5"
    - cron: "35 6 * * 1-5"
  workflow_dispatch: {}  # allows manual trigger for testing

permissions:
  contents: read

concurrency:
  group: inside-bar-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Watch the trading session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py
