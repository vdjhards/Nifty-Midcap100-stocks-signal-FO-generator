name: 15-Min Inside-Bar Scanner

on:
  schedule:
    # Exactly one event to start the watcher, at 10:31 IST (05:01 UTC), Mon-Fri.
    #
    # Previously this had two extra fallback crons "in case the first is dropped."
    # They don't help: with concurrency, only one run can be active at a time, so a
    # fallback just queues behind the live watcher for the whole ~4h session and then
    # fires uselessly after close. If this single event is ever dropped by GitHub,
    # start it by hand: Actions -> 15-Min Inside-Bar Scanner -> Run workflow.
    - cron: "1 5 * * 1-5"
    # Send the day's signal outcome report at 16:00 IST (10:30 UTC), Mon-Fri.
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}  # allows manual trigger for testing

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '30 10 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: inside-bar-scanner-watch-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Restore today's alert state
        uses: actions/cache@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            alerted-state-${{ github.ref_name }}-

      - name: Watch the trading session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Save today's alert state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.ref_name }}-${{ github.run_id }}

  report:
    if: github.event_name == 'schedule' && github.event.schedule == '30 10 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: inside-bar-scanner-report-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Restore today's alert state
        uses: actions/cache@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.ref_name }}-report
          restore-keys: |
            alerted-state-${{ github.ref_name }}-

      - name: Send signal outcome report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_signal.py --report
