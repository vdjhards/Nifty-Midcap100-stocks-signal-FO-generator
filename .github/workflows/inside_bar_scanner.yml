name: 15-Min Inside-Bar Scanner

on:
  schedule:
    # Refresh the Nifty Midcap 100 universe at 09:10 IST (03:40 UTC), Mon-Fri.
    - cron: "40 3 * * 1-5"
    # Runs every 15 min from 10:31 to 14:16 IST, Mon-Fri.
    # GitHub Actions cron is in UTC. IST = UTC+5:30, so 10:31-14:16 IST = 05:01-08:46 UTC.
    - cron: "1,16,31,46 5-8 * * 1-5"
    # Final scan at 14:31 IST (09:01 UTC), Mon-Fri.
    - cron: "1 9 * * 1-5"
  workflow_dispatch: {}  # allows manual trigger for testing

permissions:
  contents: read

concurrency:
  group: inside-bar-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-universe:
    if: github.event_name == 'schedule' && github.event.schedule == '40 3 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Restore latest Nifty Midcap 100 universe
        uses: actions/cache@v5
        with:
          path: nifty_midcap100_symbols.json
          key: nifty-midcap100-universe-${{ github.run_id }}
          restore-keys: |
            nifty-midcap100-universe-

      - name: Refresh Nifty Midcap 100 universe
        run: python scanner.py --refresh-universe

      - name: Save refreshed Nifty Midcap 100 universe
        uses: actions/cache/save@v5
        with:
          path: nifty_midcap100_symbols.json
          key: nifty-midcap100-universe-${{ github.run_id }}

  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '40 3 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Restore today's alert state
        uses: actions/cache@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.run_id }}
          restore-keys: |
            alerted-state-

      - name: Restore latest Nifty Midcap 100 universe
        uses: actions/cache@v5
        with:
          path: nifty_midcap100_symbols.json
          key: nifty-midcap100-universe-${{ github.run_id }}
          restore-keys: |
            nifty-midcap100-universe-

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save today's alert state
        uses: actions/cache/save@v5
        if: always()
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.run_id }}
