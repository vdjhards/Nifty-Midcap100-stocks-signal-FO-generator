name: 15-Min Inside-Bar Scanner

on:
  schedule:
    # Start one long-lived watcher at 10:31 IST (05:01 UTC), Mon-Fri.
    - cron: "1 5 * * 1-5"
    # Fallback starts if the first scheduled event is dropped.
    - cron: "16 5 * * 1-5"
    - cron: "31 5 * * 1-5"
    # Send the day's signal outcome report at 18:00 IST (12:30 UTC), Mon-Fri.
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}  # allows manual trigger for testing

permissions:
  contents: read

concurrency:
  group: inside-bar-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '30 12 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Restore today's alert state
        uses: actions/cache@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            alerted-state-${{ github.ref_name }}-

      - name: Watch the trading session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Save today's alert state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.ref_name }}-${{ github.run_id }}

  report:
    if: github.event_name == 'schedule' && github.event.schedule == '30 12 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install yfinance requests python-dotenv

      - name: Restore today's alert state
        uses: actions/cache@v5
        with:
          path: alerted_today.json
          key: alerted-state-${{ github.ref_name }}-report
          restore-keys: |
            alerted-state-${{ github.ref_name }}-

      - name: Send signal outcome report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_signal.py --report
